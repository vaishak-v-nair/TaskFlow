[build]
builder = "nixpacks"
buildCommand = "npm cache clean --force && npm ci && npm run build"

[deploy]
startCommand = "npm run migrate && npm start"
healthcheckPath = "/api/auth/me"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[networks]
private = true

[build.env]
NODE_VERSION = "20"
