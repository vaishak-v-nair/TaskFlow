[build]
builder = "nixpacks"
buildCommand = "npm ci --ignore-scripts --no-fund --no-audit && npx prisma generate && npm run build"

[deploy]
startCommand = "npm run migrate && exec node .next/standalone/server.js"
healthcheckPath = "/login"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[networks]
private = true

[build.env]
NODE_VERSION = "20.19.0"
